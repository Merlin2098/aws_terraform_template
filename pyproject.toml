[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-framework"
version = "0.2.0"
description = "Workspace Framework — multi-repo AI guidance engine (consumed by reference)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "jsonschema",
    "pyyaml",
]

[project.scripts]
agents-framework = "agents_framework.cli:main"

# Optional dependency groups map capabilities → pip extras.
# Hosts that enable a capability can install the corresponding extra.
# [dependency-groups] (PEP 735) is intentionally NOT used here for pip compat.
[project.optional-dependencies]
local = [
    "duckdb",
    "fastexcel",
    "openpyxl",
    "pathspec",
    "polars",
    "psycopg2-binary",
    "xlsxwriter",
    "great-expectations; python_version < '3.14'",
]

cloud = [
    "awswrangler",
    "boto3",
    "python-jose[cryptography]",
    "python-dotenv",
    "truststore",
]

saas = [
    "alembic",
    "asyncpg",
    "fastapi",
    "pydantic-settings",
    "python-jose[cryptography]",
    "uvicorn[standard]",
]

supabase = [
    "supabase",
]

# dev extras replace [dependency-groups] for pip compatibility
dev = [
    "faker",
    "httpx",
    "hypothesis",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

dev-cloud = [
    "checkov",
    "moto",
    "tftest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents_framework*"]

[tool.setuptools.package-data]
"agents_framework" = [
    "data/**/*",
]

[tool.pytest.ini_options]
markers = [
    "cloud: tests that require live AWS credentials (skipped without them)",
]
