artifacts:
  - .ai/context_bundle.yaml
  - .ai/skills_registry.json
  - .ai/dependencies_graph.json
  - .ai/treemap.md
  - llms.txt

ignore_dirs:
  - .ai
  - .git
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .venv
  - __pycache__
  - ai
  - artifacts
  - build
  - dist
  - docs
  - node_modules
  - venv

treemap_ignore_dirs:
  - .ai
  - .git
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .venv
  - __pycache__
  - build
  - dist
  - node_modules
  - venv

ignore_top_level_files:
  - .pre-commit-config.yaml

structure:
  python:
    - src/
    - scripts/
  sql:
    - src/transformations/
  config:
    - src/config/
  contracts:
    - src/contracts/
  infrastructure:
    - infra/
  guidance:
    - ai/skills.yaml
    - ai/skills/
    - ai/context.yaml
    - ai/domains/
    - ai/policies/
    - specs/template/
    - specs/project/
  optional_context:
    - .ai/

rules:
  - .ai/ is optional generated context and is never required at runtime.
  - Keep execution explicit through existing scripts, Make targets, and direct Terraform commands.
  - ai/skills.yaml and ai/skills/ are the authoritative AI guidance sources.
  - Infrastructure changes remain explicit and reviewed before terraform apply or destroy.
  - For Terraform on AWS, prefer destroyable, low-cost, reproducible infrastructure with explicit resource ownership over enterprise-by-default designs.
  - Terraform-managed AWS resources should include standard tags for Project, Environment, Owner, and ManagedBy=Terraform.
  - When using Terraform, explicitly declare the infrastructure required by each service, including logs and log groups, instead of relying on autogenerated service resources.
  - In dev and sandbox environments, prefer force-destroyable storage, short log retention, and serverless or low-cost defaults unless the user explicitly asks otherwise.
  - specs/template/ contains the immutable contracts inherited from the template (read-only in host repos); specs/project/ is where the host repo writes its own contracts.
  - specs/ is only present in cloud-profile installations; do not assume its existence in local-profile hosts.

entrypoint_roots:
  directories:
    - scripts
    - src/jobs

module_roots:
  directories:
    - src
