artifacts:
  light:
    - .ai/context_bundle.yaml
    - .ai/skills_registry.json
  full:
    - .ai/context_bundle.yaml
    - .ai/skills_registry.json
    - .ai/dependencies_graph.json
    - .ai/treemap.md

ignore_dirs:
  - .ai
  - .git
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .venv
  - __pycache__
  - ai
  - artifacts
  - build
  - dist
  - docs
  - node_modules
  - venv

treemap_ignore_dirs:
  - .ai
  - .git
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .venv
  - __pycache__
  - build
  - dist
  - node_modules
  - venv

ignore_top_level_files:
  - .pre-commit-config.yaml

structure:
  python:
    - main.py
    - src/
    - scripts/
  sql:
    - src/transformations/
  config:
    - src/config/
  contracts:
    - src/contracts/
  infrastructure:
    - infra/
  guidance:
    - ai/skills.yaml
    - ai/skills/
    - ai/context.yaml
  optional_context:
    - .ai/

rules:
  - .ai/ is optional generated context and is never required at runtime.
  - Keep execution explicit through existing scripts, Make targets, and direct Terraform commands.
  - ai/skills.yaml and ai/skills/ are the authoritative AI guidance sources.
  - Infrastructure changes remain explicit and reviewed before terraform apply or destroy.

entrypoint_roots:
  files:
    - main.py
  directories:
    - scripts
    - src/jobs

module_roots:
  files:
    - main.py
  directories:
    - src
