repos:
  - repo: local
    hooks:
      - id: ai-refresh-light
        name: AI refresh (light)
        entry: python scripts/ai_refresh.py --light
        language: python
        additional_dependencies:
          - pyyaml
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-lint
        name: ruff lint
        entry: python scripts/run_ruff_check.py
        language: python
        additional_dependencies:
          - ruff
        pass_filenames: false
        stages: [manual]
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [manual]
      - id: sync-requirements
        name: Sync virtual environment dependencies
        entry: python scripts/sync_requirements.py
        language: system
        files: ^requirements\.txt$
        pass_filenames: false
