repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format src tests scripts
        language: system
        pass_filenames: false
      - id: ruff-lint
        name: ruff lint
        entry: python -m ruff check src tests scripts
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        stages: [manual]
      - id: sync-requirements
        name: Sync virtual environment dependencies
        entry: python scripts/sync_requirements.py
        language: system
        files: ^requirements\.txt$
        pass_filenames: false
